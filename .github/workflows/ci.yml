name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test · ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  package:
    name: packaging smoke test · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # npm pack (fresh build) -> install into an empty dir -> run the CLI on a bundled sample.
      - run: npm run smoke:pack

  real-adversary:
    name: injection-leak gate vs. real bla-agents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # Installs the published bla-agents, hardens REE's fixtures at
      # bankrupt/llm-directives, and fails on any injection leak.
      - run: npm run bench:real
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-adversary-results
          path: benchmarks/real/RESULTS.md
          if-no-files-found: ignore

  protections:
    name: protection gates (Terser, javascript-obfuscator, R8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # jadx (Apache-2.0) is optional for users; CI installs it so the R8→APK gate is
      # actually exercised. Without it that row is reported as skipped, not failed.
      - name: Install jadx 1.5.6
        run: |
          curl -fsSL -o "$RUNNER_TEMP/jadx.zip" https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip
          unzip -q "$RUNNER_TEMP/jadx.zip" -d "$RUNNER_TEMP/jadx"
          chmod +x "$RUNNER_TEMP/jadx/bin/jadx"
          echo "$RUNNER_TEMP/jadx/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run bench:obfuscation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protection-results
          path: benchmarks/obfuscation/RESULTS.md
          if-no-files-found: ignore
